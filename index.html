<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Акт с телефона</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: 'Manrope', sans-serif;
        margin: 0; min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #1e1b4b 50%, #312e81);
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
    }
    .card {
        background: #fff; border-radius: 24px; padding: 32px 24px;
        width: 100%; max-width: 400px; text-align: center;
        box-shadow: 0 25px 70px rgba(0,0,0,.5);
    }
    h1 { font-size: 1.4rem; margin: 0 0 6px; color: #0f172a; }
    p.sub { color: #64748b; font-size: .85rem; margin: 0 0 24px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-weight: 700; font-size: .9rem; color: #334155; margin-bottom: 8px; }
    select, input[type=text] {
        width: 100%; padding: 14px; border-radius: 12px;
        border: 1.5px solid #e2e8f0; font-size: 1rem; font-family: inherit;
        background: #f8fafc;
    }
    select:focus, input[type=text]:focus { outline: none; border-color: #4f46e5; }
    #reader {
        width: 100%; border-radius: 16px; overflow: hidden;
        margin-bottom: 16px; background: #000;
    }
    #reader video { border-radius: 16px; }
    .btn-scan {
        display: block; width: 100%; padding: 20px;
        border: none; border-radius: 16px; cursor: pointer;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: #fff; font-size: 1.15rem; font-weight: 800; font-family: inherit;
        box-shadow: 0 10px 25px rgba(79,70,229,.4);
        margin-bottom: 12px;
    }
    .btn-scan:active { transform: scale(.97); }
    .btn-stop {
        display: none; width: 100%; padding: 14px;
        border: none; border-radius: 12px; cursor: pointer;
        background: #ef4444; color: #fff; font-weight: 700; font-family: inherit;
        margin-bottom: 12px;
    }
    .btn-send {
        display: block; width: 100%; padding: 20px;
        border: none; border-radius: 16px; cursor: pointer;
        background: linear-gradient(135deg, #059669, #10b981);
        color: #fff; font-size: 1.15rem; font-weight: 800; font-family: inherit;
        box-shadow: 0 10px 25px rgba(5,150,105,.4);
        margin-bottom: 12px;
    }
    .btn-send:active { transform: scale(.97); }
    #status { margin-top: 20px; font-weight: 700; font-size: .95rem; color: #334155; min-height: 24px; }
    #result { margin-top: 16px; }
    .result-box {
        background: #f8fafc; padding: 16px; border-radius: 12px;
        text-align: left; white-space: pre-wrap; font-size: .9rem; line-height: 1.5;
        border-left: 4px solid #10b981;
    }
    .spin { display: inline-block; animation: rot 1s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }
    input[type=file] { display: none; }
    .debug {
        margin-top: 20px; padding: 12px; background: #f1f5f9;
        border-radius: 8px; font-size: .7rem; color: #475569;
        text-align: left; white-space: pre-wrap; max-height: 150px; overflow-y: auto;
    }
    .manual-input { display: flex; gap: 8px; margin-top: 12px; }
    .manual-input input { flex: 1; }
    .manual-input button {
        padding: 14px 20px; border: none; border-radius: 12px;
        background: #059669; color: #fff; font-weight: 700; font-family: inherit; cursor: pointer;
    }
</style>
</head>
<body>
<div class="card">
    <h1>📋 Генератор Актов</h1>
    <p class="sub">Отсканируй QR или введи номер вручную</p>

    <div class="form-group">
        <label for="specialist">👤 Кто сканирует:</label>
        <select id="specialist">
            <option value="">Загрузка...</option>
        </select>
    </div>

    <div id="reader"></div>
    <button class="btn-scan" id="btnScan">📷 Сканировать QR</button>
    <button class="btn-stop" id="btnStop">⏹ Остановить камеру</button>

    <div class="form-group">
        <label for="invNumber"> Инвентарный номер:</label>
        <input type="text" id="invNumber" placeholder="Будет заполнен автоматически" readonly>
        <div class="manual-input">
            <input type="text" id="manualInv" placeholder="Или введи вручную">
            <button id="btnManual">OK</button>
        </div>
    </div>

    <button class="btn-send" id="btnSend">✅ Отправить запрос</button>

    <div id="status"></div>
    <div id="result"></div>
    <div id="debug" class="debug"></div>
</div>

<script>
// ===== НАСТРОЙКИ =====
// ВСТАВЬ СЮДА СВОЙ GITHUB ТОКЕН (с правами на запись в requests/)
const GITHUB_TOKEN = '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';
const GITHUB_REPO = 'Azaeska/acts-phone';
const GITHUB_BRANCH = 'main';
const REQUESTS_PATH = 'requests';
const RESULTS_PATH = 'results';

const GITHUB_API = 'https://api.github.com/repos/' + GITHUB_REPO + '/contents';

const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const specialistSelect = document.getElementById('specialist');
const invNumberInput = document.getElementById('invNumber');
const manualInvInput = document.getElementById('manualInv');
const debugEl = document.getElementById('debug');
const btnScan = document.getElementById('btnScan');
const btnStop = document.getElementById('btnStop');
const btnSend = document.getElementById('btnSend');
const btnManual = document.getElementById('btnManual');

const sleep = ms => new Promise(r => setTimeout(r, ms));
let html5QrCode = null;
let isScanning = false;

function log(msg) {
    console.log(msg);
    debugEl.textContent += msg + '\n';
    debugEl.scrollTop = debugEl.scrollHeight;
}

// Надёжное декодирование base64 → UTF-8
function b64DecodeUnicode(str) {
    const byteCharacters = atob(str);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    return new TextDecoder('utf-8').decode(byteArray);
}

// Загрузка списка специалистов
async function loadSpecialists() {
    log('Загружаю список специалистов...');
    try {
        const r = await fetch(GITHUB_API + '/specialists.json', {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!r.ok) throw new Error('GitHub API ошибка: ' + r.status);
        const data = await r.json();
        const decoded = b64DecodeUnicode(data.content);
        const specialists = JSON.parse(decoded);
        log('Получено специалистов: ' + specialists.length);
        
        specialistSelect.innerHTML = '<option value="">Выбери специалиста...</option>';
        specialists.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.fio;
            opt.textContent = s.fio + ' (' + s.position + ')';
            specialistSelect.appendChild(opt);
        });
        log('✅ Список загружен!');
    } catch (err) {
        log('❌ Ошибка: ' + err.message);
        specialistSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
    }
}

loadSpecialists();

// ===== СКАНЕР QR =====

btnScan.addEventListener('click', async () => {
    if (isScanning) return;
    
    try {
        html5QrCode = new Html5Qrcode("reader");
        await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            onScanSuccess,
            onScanFailure
        );
        isScanning = true;
        btnScan.style.display = 'none';
        btnStop.style.display = 'block';
        log(' Камера запущена...');
    } catch (err) {
        log('❌ Ошибка камеры: ' + err.message);
        statusEl.innerHTML = '❌ Не удалось открыть камеру. Проверь разрешения.';
    }
});

btnStop.addEventListener('click', async () => {
    if (html5QrCode && isScanning) {
        await html5QrCode.stop();
        html5QrCode.clear();
        isScanning = false;
        btnScan.style.display = 'block';
        btnStop.style.display = 'none';
        log('⏹ Камера остановлена');
    }
});

function onScanSuccess(decodedText, decodedResult) {
    log('✅ QR распознан: ' + decodedText);
    invNumberInput.value = decodedText;
    
    if (html5QrCode && isScanning) {
        html5QrCode.stop();
        html5QrCode.clear();
        isScanning = false;
        btnScan.style.display = 'block';
        btnStop.style.display = 'none';
    }
    
    statusEl.innerHTML = '✅ QR распознан! Нажми "Отправить запрос"';
}

function onScanFailure(error) {
    // Игнорируем — камера просто ищет QR
}

// Ручной ввод
btnManual.addEventListener('click', () => {
    const val = manualInvInput.value.trim();
    if (val) {
        invNumberInput.value = val;
        manualInvInput.value = '';
        log('🔢 Введён номер вручную: ' + val);
        statusEl.innerHTML = '✅ Номер введён! Нажми "Отправить запрос"';
    }
});

// ===== ОТПРАВКА ЗАПРОСА =====

btnSend.addEventListener('click', async () => {
    const specialist = specialistSelect.value;
    const invNumber = invNumberInput.value.trim();
    
    if (!specialist) {
        statusEl.innerHTML = '⚠️ Сначала выбери специалиста!';
        return;
    }
    if (!invNumber) {
        statusEl.innerHTML = '️ Введи или отсканируй инвентарный номер!';
        return;
    }
    
    resultEl.innerHTML = '';
    const ts = Date.now();
    const requestFilename = `${ts}.txt`;
    const requestContent = invNumber;

    try {
        statusEl.innerHTML = '<span class="spin">⏳</span> Отправляю запрос...';
        log('Отправляю номер ' + invNumber + ' на GitHub...');
        
        // Кодируем в base64
        const encoded = btoa(unescape(encodeURIComponent(requestContent)));
        const url = GITHUB_API + '/' + REQUESTS_PATH + '/' + requestFilename;
        
        const r = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': 'token ' + GITHUB_TOKEN,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: 'New scan request',
                content: encoded,
                branch: GITHUB_BRANCH
            })
        });
        
        if (!r.ok) throw new Error('Ошибка загрузки запроса: ' + r.status + ' ' + await r.text());
        
        log('✅ Запрос загружен, жду ответ...');
        statusEl.innerHTML = '<span class="spin"></span> Запрос отправлен! Обрабатываю...';
        
        // Ждём ответ (до 2 минут, проверка каждые 2 сек)
        for (let i = 0; i < 60; i++) {
            await sleep(2000);
            
            const resultApiUrl = GITHUB_API + '/' + RESULTS_PATH;
            const lr = await fetch(resultApiUrl, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });
            
            if (!lr.ok) continue;
            
            const lj = await lr.json();
            const found = lj.find(it => it.name === `result_${ts}.txt`);
            
            if (found) {
                log('✅ Результат найден: ' + found.name);
                
                const rr = await fetch(found.url, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                
                if (!rr.ok) throw new Error('Ошибка загрузки результата: ' + rr.status);
                
                const rd = await rr.json();
                const decoded = b64DecodeUnicode(rd.content);
                
                statusEl.innerHTML = '✅ Готово!';
                resultEl.innerHTML = '<div class="result-box">' + decoded.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
                log('✅ Результат отображён!');
                
                invNumberInput.value = '';
                return;
            }
        }
        statusEl.innerHTML = '️ Сервер не ответил за 2 минуты.';
        log('⚠️ Таймаут');
    } catch (err) {
        statusEl.innerHTML = '❌ Ошибка: ' + err.message;
        log('❌ ' + err.message);
    }
});
</script>
</body>
</html>
