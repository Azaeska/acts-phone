<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Акт с телефона</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: 'Manrope', sans-serif;
        margin: 0; min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #1e1b4b 50%, #312e81);
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
    }
    .card {
        background: #fff; border-radius: 24px; padding: 32px 24px;
        width: 100%; max-width: 400px; text-align: center;
        box-shadow: 0 25px 70px rgba(0,0,0,.5);
    }
    h1 { font-size: 1.4rem; margin: 0 0 6px; color: #0f172a; }
    p.sub { color: #64748b; font-size: .85rem; margin: 0 0 24px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-weight: 700; font-size: .9rem; color: #334155; margin-bottom: 8px; }
    select {
        width: 100%; padding: 14px; border-radius: 12px;
        border: 1.5px solid #e2e8f0; font-size: 1rem; font-family: inherit;
        background: #f8fafc; appearance: none;
    }
    select:focus { outline: none; border-color: #4f46e5; }
    .btn-photo {
        display: block; width: 100%; padding: 20px;
        border: none; border-radius: 16px; cursor: pointer;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: #fff; font-size: 1.15rem; font-weight: 800; font-family: inherit;
        box-shadow: 0 10px 25px rgba(79,70,229,.4);
    }
    .btn-photo:active { transform: scale(.97); }
    #status { margin-top: 20px; font-weight: 700; font-size: .95rem; color: #334155; min-height: 24px; }
    #result { margin-top: 16px; }
    .result-box {
        background: #f8fafc;
        padding: 16px;
        border-radius: 12px;
        text-align: left;
        white-space: pre-wrap;
        font-size: .9rem;
        line-height: 1.5;
        border-left: 4px solid #10b981;
    }
    .spin { display: inline-block; animation: rot 1s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }
    input[type=file] { display: none; }
    .debug {
        margin-top: 20px; padding: 12px; background: #f1f5f9;
        border-radius: 8px; font-size: .7rem; color: #475569;
        text-align: left; white-space: pre-wrap; max-height: 150px; overflow-y: auto;
    }
</style>
</head>
<body>
<div class="card">
    <h1> Генератор Актов</h1>
    <p class="sub">Выбери специалиста и сфотографируй QR</p>

    <div class="form-group">
        <label for="specialist">👤 Кто фоткает:</label>
        <select id="specialist">
            <option value="">Загрузка...</option>
        </select>
    </div>

    <label class="btn-photo" for="camera">📷 Сфотографировать QR</label>
    <input type="file" id="camera" accept="image/*" capture="environment">

    <div id="status"></div>
    <div id="result"></div>
    <div id="debug" class="debug"></div>
</div>

<script>
const TOKEN = 'y0__wgBEK-D-7IHGPyVSyDw36GgGT_TVerXZdSfzGjgDVqQcvqXIvw0';
const API = 'https://cloud-api.yandex.net/v1/disk';
const H = { 'Authorization': 'OAuth ' + TOKEN };

const GITHUB_API = 'https://api.github.com/repos/Azaeska/acts-phone/contents';
const RESULTS_PATH = 'results';

const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const specialistSelect = document.getElementById('specialist');
const debugEl = document.getElementById('debug');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function log(msg) {
    console.log(msg);
    debugEl.textContent += msg + '\n';
    debugEl.scrollTop = debugEl.scrollHeight;
}

// Надёжное декодирование base64 → UTF-8 (работает с кириллицей)
function b64DecodeUnicode(str) {
    const byteCharacters = atob(str);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    return new TextDecoder('utf-8').decode(byteArray);
}

// Загружаем список специалистов с GitHub
async function loadSpecialists() {
    log('Загружаю список специалистов с GitHub...');
    try {
        const r = await fetch(GITHUB_API + '/specialists.json', {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        
        if (!r.ok) throw new Error('GitHub API ошибка: ' + r.status);
        
        const data = await r.json();
        log('Файл найден, размер: ' + data.size + ' байт');
        
        const decoded = b64DecodeUnicode(data.content);
        const specialists = JSON.parse(decoded);
        log('Получено специалистов: ' + specialists.length);
        
        specialistSelect.innerHTML = '<option value="">Выбери специалиста...</option>';
        specialists.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.fio;
            opt.textContent = s.fio + ' (' + s.position + ')';
            specialistSelect.appendChild(opt);
        });
        log('✅ Список загружен!');
    } catch (err) {
        log(' Ошибка: ' + err.message);
        specialistSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
    }
}

loadSpecialists();

// Обработка выбора файла (фото)
document.getElementById('camera').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    
    const specialist = specialistSelect.value;
    if (!specialist) {
        statusEl.innerHTML = '⚠️ Сначала выбери специалиста!';
        return;
    }
    
    resultEl.innerHTML = '';
    const ts = Date.now();
    const safeName = specialist.replace(/[^a-zA-Zа-яА-Я0-9]/g, '_');
    const name = safeName + '_' + ts + '.jpg';

    try {
        statusEl.innerHTML = '<span class="spin">⏳</span> Отправляю фото...';
        
        const up = await fetch(API + '/resources/upload?path=' + encodeURIComponent('/acts-bot/inbox/' + name) + '&overwrite=true', { headers: H });
        const upj = await up.json();
        if (!upj.href) throw new Error('Не удалось получить ссылку для загрузки');
        
        const put = await fetch(upj.href, { method: 'PUT', body: file });
        if (put.status !== 201) throw new Error('Ошибка загрузки: ' + put.status);

        statusEl.innerHTML = '<span class="spin">⏳</span> Фото отправлено! Обрабатываю...';
        log('Фото загружено, жду результат на GitHub...');

        // Ждём результат на GitHub (до 2 минут, проверка каждые 5 сек)
        for (let i = 0; i < 24; i++) {
            await sleep(5000);
            
            const resultApiUrl = GITHUB_API + '/' + RESULTS_PATH;
            const lr = await fetch(resultApiUrl, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });
            
            if (!lr.ok) {
                log('Папка results ещё не доступна');
                continue;
            }
            
            const lj = await lr.json();
            
            // Ищем файл по ТОЧНОМУ имени: result_TIMESTAMP.txt
            const found = lj.find(it => it.name === `result_${ts}.txt`);
            
            if (found) {
                log('Результат найден: ' + found.name);
                
                const rr = await fetch(found.url, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                
                if (!rr.ok) throw new Error('Ошибка загрузки результата: ' + rr.status);
                
                const rd = await rr.json();
                const decoded = b64DecodeUnicode(rd.content);
                
                statusEl.innerHTML = '✅ Готово!';
                resultEl.innerHTML = '<div class="result-box">' + decoded.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
                log('✅ Результат отображён!');
                return;
            }
        }
        statusEl.innerHTML = '⚠️ Сервер не ответил за 2 минуты. Проверь, запущен ли бот.';
        log('⚠️ Таймаут ожидания результата');
    } catch (err) {
        statusEl.innerHTML = '❌ Ошибка: ' + err.message;
        log('❌ Критическая ошибка: ' + err.message);
    }
});
</script>
</body>
</html>
